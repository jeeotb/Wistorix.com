      <text x="50" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0a263f">18-24 thang</text>
      <text x="50" y="206" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#54707a">Nang RAM / SSD</text>
      <text x="50" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#54707a">hoac thay pin</text>
