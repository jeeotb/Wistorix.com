      <circle cx="50" cy="86" r="18" fill="#10a968" stroke="#fff" stroke-width="8"/>
      <text x="50" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0a263f">Ngay +1</text>
      <text x="50" y="206" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#54707a">Hoi tham cai dat</text>
