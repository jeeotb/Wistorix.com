    <text x="96" y="48" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0a263f">Doanh thu tu nhien</text>
    <text x="96" y="82" font-family="Inter, Arial, sans-serif" font-size="18" fill="#55707c">Bao duong, nang cap, phu kien</text>
