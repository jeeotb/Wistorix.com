    <line x1="114" y1="140" x2="964" y2="140" stroke="#d6e8df" stroke-width="14" stroke-linecap="round"/>
    <line x1="114" y1="140" x2="964" y2="140" stroke="url(#green)" stroke-width="8" stroke-linecap="round"/>

