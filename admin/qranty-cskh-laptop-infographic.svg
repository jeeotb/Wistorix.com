    <text x="0" y="54" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#0a263f">Lich cham soc khach hang</text>
    <text x="0" y="104" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#0a263f">cho shop may tinh / laptop</text>
    <text x="0" y="154" font-family="Inter, Arial, sans-serif" font-size="24" fill="#436170">Cham dung thoi diem vang de khach cu quay lai tu nhien.</text>
