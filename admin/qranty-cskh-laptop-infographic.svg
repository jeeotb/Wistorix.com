      <text x="50" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0a263f">Thang 6</text>
      <text x="50" y="206" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#54707a">Don rac, toi uu</text>
      <text x="50" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#54707a">va quet virus</text>
