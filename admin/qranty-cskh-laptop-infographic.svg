  <rect width="1440" height="900" rx="48" fill="url(#bg)"/>
  <path d="M0 675 C 245 605 338 755 560 688 C 786 620 912 496 1140 560 C 1267 596 1352 656 1440 604 L1440 900 L0 900 Z" fill="#e3f7ea"/>
