<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Timeline cham soc khach hang cho shop may tinh laptop</title>
  <desc id="desc">Infographic ve bon moc cham soc khach hang: sau mua 1 ngay, thang thu 6, thang thu 12 va thang thu 18 den 24.</desc>
  <defs>
