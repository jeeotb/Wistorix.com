<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1256 830" font-family="Manrope, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021E6B"/>
      <stop offset="0.55" stop-color="#041335"/>
      <stop offset="1" stop-color="#041335"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#058EF4" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#0052CD" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#041335" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#0052CD" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#041335" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1256" height="830" fill="url(#bg)"/>
  <rect width="1256" height="830" fill="url(#glow)"/>
  <rect width="1256" height="830" fill="url(#glow2)"/>

  <!-- fine grid -->
  <g stroke="#3373D7" stroke-opacity="0.10">
    <path d="M0 166 H1256 M0 332 H1256 M0 498 H1256 M0 664 H1256"/>
    <path d="M157 0 V830 M314 0 V830 M471 0 V830 M628 0 V830 M785 0 V830 M942 0 V830 M1099 0 V830"/>
  </g>

  <!-- wide orbit rings, kept away from center text -->
  <g fill="none">
    <circle cx="628" cy="470" r="330" stroke="#3373D7" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle cx="628" cy="470" r="430" stroke="#3373D7" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="2 10"/>
    <path d="M 628 140 A 330 330 0 0 1 940 350" stroke="#058EF4" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 628 470" to="360 628 470" dur="30s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- corner glass chips, subtle, away from headline -->
  <g>
    <g opacity="0.85">
      <rect x="86" y="150" width="150" height="46" rx="12" fill="url(#card)" stroke="#3373D7" stroke-opacity="0.4"/>
      <circle cx="112" cy="173" r="10" fill="#058EF4" fill-opacity="0.8"/>
      <rect x="132" y="162" width="66" height="8" rx="4" fill="#99B7EB" fill-opacity="0.7"/>
      <rect x="132" y="176" width="44" height="7" rx="3.5" fill="#668FE0" fill-opacity="0.5"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="7s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.85">
      <rect x="1020" y="180" width="150" height="46" rx="12" fill="url(#card)" stroke="#3373D7" stroke-opacity="0.4"/>
      <circle cx="1046" cy="203" r="10" fill="#99B7EB" fill-opacity="0.8"/>
      <rect x="1066" y="192" width="66" height="8" rx="4" fill="#99B7EB" fill-opacity="0.7"/>
      <rect x="1066" y="206" width="44" height="7" rx="3.5" fill="#668FE0" fill-opacity="0.5"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="8s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.8">
      <rect x="150" y="560" width="150" height="46" rx="12" fill="url(#card)" stroke="#3373D7" stroke-opacity="0.4"/>
      <path d="M176 574 l9 3.5 v7 c0 6 -4 9.5 -9 12 c-5 -2.5 -9 -6 -9 -12 v-7 z" fill="#058EF4" fill-opacity="0.9"/>
      <rect x="196" y="572" width="66" height="8" rx="4" fill="#99B7EB" fill-opacity="0.7"/>
      <rect x="196" y="586" width="44" height="7" rx="3.5" fill="#668FE0" fill-opacity="0.5"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="6.5s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.8">
      <rect x="980" y="540" width="150" height="46" rx="12" fill="url(#card)" stroke="#3373D7" stroke-opacity="0.4"/>
      <circle cx="1006" cy="563" r="10" fill="none" stroke="#058EF4" stroke-width="3"/>
      <path d="M1002 563 l3 3 l6 -7" stroke="#F0F4FC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1026" y="552" width="66" height="8" rx="4" fill="#99B7EB" fill-opacity="0.7"/>
      <rect x="1026" y="566" width="44" height="7" rx="3.5" fill="#668FE0" fill-opacity="0.5"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="7.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- satellite dots -->
  <g>
    <circle cx="628" cy="140" r="5" fill="#058EF4"/>
    <circle cx="958" cy="470" r="4" fill="#99B7EB" opacity="0.8"/>
    <circle cx="298" cy="470" r="4" fill="#99B7EB" opacity="0.8"/>
    <circle cx="420" cy="90" r="3" fill="#F0F4FC" opacity="0.5"/>
    <circle cx="860" cy="70" r="2.5" fill="#F0F4FC" opacity="0.4"/>
    <circle cx="1150" cy="380" r="3" fill="#F0F4FC" opacity="0.4"/>
    <circle cx="100" cy="400" r="2.5" fill="#F0F4FC" opacity="0.4"/>
  </g>
</svg>
